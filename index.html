<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Memorial Day Cookout</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'DM Sans', sans-serif; background: #FAF5ED; color: #2D2418; min-height: 100vh; }
.header { background: linear-gradient(145deg, #8B2F0A 0%, #B8420F 35%, #D46A25 100%); padding: 36px 20px 30px; text-align: center; color: white; position: relative; }
.header-sm { padding: 24px 20px 20px; }
.header::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle at 30% 100%, rgba(255,255,255,0.07) 0%, transparent 60%); pointer-events: none; }
.header h1 { font-size: 26px; font-weight: 800; position: relative; letter-spacing: -0.3px; }
.header h1.sm { font-size: 22px; }
.header .subtitle { font-size: 15px; opacity: 0.93; margin-top: 6px; font-weight: 500; position: relative; }
.header .detail { font-size: 13px; opacity: 0.75; margin-top: 3px; position: relative; }
.header .address { font-size: 13px; opacity: 0.85; margin-top: 8px; position: relative; }

.ticker { background: #3B2F20; color: #F5E6D0; padding: 10px 16px; display: flex; justify-content: center; gap: 20px; font-size: 13px; font-weight: 600; letter-spacing: 0.3px; flex-wrap: wrap; }
.ticker .total { color: #E8C98A; }
.ticker .sep { opacity: 0.4; }
.ticker.hidden { display: none; }

.nav { display: flex; background: #fff; border-bottom: 2px solid #EDE3D3; position: sticky; top: 0; z-index: 20; }
.nav button { flex: 1; padding: 13px 8px; border: none; background: #fff; color: #8B7355; font-weight: 500; font-size: 13px; cursor: pointer; border-bottom: 3px solid transparent; font-family: inherit; }
.nav button.active { background: #FAF5ED; color: #B8420F; font-weight: 700; border-bottom-color: #B8420F; }

.body { max-width: 540px; margin: 0 auto; padding: 20px 16px 48px; }
.card { background: #fff; border-radius: 14px; padding: 20px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(45,36,24,0.05); border: 1px solid #EDE3D3; }
.heading { font-size: 17px; font-weight: 700; color: #2D2418; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }

.desc-line { font-size: 15px; line-height: 1.5; color: #4A3F32; margin-bottom: 14px; }
.desc-line:last-child { margin-bottom: 0; }

.btn-primary { width: 100%; padding: 16px; border-radius: 12px; border: none; background: linear-gradient(135deg, #B8420F 0%, #D46A25 100%); color: white; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 20px; box-shadow: 0 4px 14px rgba(184,66,15,0.2); }
.btn-primary:disabled { background: #D5C9B8; box-shadow: none; cursor: not-allowed; }
.btn-ghost { background: none; border: 1.5px solid #DDD2C0; border-radius: 10px; padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer; color: #6B5D4D; font-family: inherit; width: 100%; }
.spacer { height: 10px; }

.label { display: block; font-size: 13px; font-weight: 600; color: #6B5D4D; margin-bottom: 5px; margin-top: 16px; }
.label:first-child { margin-top: 0; }
.input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid #DDD2C0; font-size: 15px; font-family: inherit; background: #FDFAF6; color: #2D2418; outline: none; }
.select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid #DDD2C0; font-size: 15px; font-family: inherit; background: #FDFAF6; color: #2D2418; outline: none; appearance: none; }

.num-row { display: flex; align-items: center; gap: 14px; }
.num-btn { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid #DDD2C0; background: #FDFAF6; font-size: 18px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #6B5D4D; font-family: inherit; }
.num-val { font-size: 20px; font-weight: 700; min-width: 24px; text-align: center; }

.pill-row { display: flex; gap: 8px; }
.pill { padding: 10px 16px; border-radius: 10px; border: 1.5px solid #DDD2C0; background: #FDFAF6; cursor: pointer; font-size: 14px; font-weight: 400; color: #6B5D4D; font-family: inherit; text-align: center; flex: 1; }
.pill.active { border-color: #B8420F; background: #FEF3EC; font-weight: 600; color: #B8420F; }

.cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cat-btn { padding: 10px 12px; border-radius: 10px; border: 1.5px solid #DDD2C0; background: #FDFAF6; cursor: pointer; font-size: 13px; font-weight: 400; color: #6B5D4D; font-family: inherit; text-align: left; }
.cat-btn.active { border-color: #B8420F; background: #FEF3EC; font-weight: 600; color: #B8420F; }
.cat-btn .count { font-size: 11px; color: #8B7355; margin-top: 2px; }

.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 14px; border-radius: 20px; border: 1.5px solid #DDD2C0; background: #FDFAF6; cursor: pointer; font-size: 13px; font-weight: 400; color: #6B5D4D; font-family: inherit; }
.chip.active { border-color: #5B8C3E; background: #F0F7EA; font-weight: 600; color: #3D6B1F; }

.stat-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.stat { text-align: center; padding: 14px 8px; background: #FDFAF6; border-radius: 12px; border: 1px solid #EDE3D3; }
.stat-num { font-size: 26px; font-weight: 800; color: #B8420F; line-height: 1; }
.stat-lbl { font-size: 11px; color: #8B7355; margin-top: 3px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

.food-card { background: #fff; border-radius: 12px; border: 1px solid #EDE3D3; overflow: hidden; margin-bottom: 10px; }
.food-card.compact { margin-bottom: 6px; }
.food-header { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
.food-card.compact .food-header { padding: 10px 14px; }
.food-info { display: flex; align-items: center; gap: 10px; }
.food-emoji { font-size: 22px; }
.food-card.compact .food-emoji { font-size: 18px; }
.food-label { font-weight: 700; font-size: 15px; color: #2D2418; }
.food-card.compact .food-label { font-size: 14px; }
.food-examples { font-size: 12px; color: #A89478; margin-top: 1px; }
.food-badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.food-badge.open { background: #FFF8F0; color: #C49555; }
.food-badge.filled { background: #F0F7EA; color: #4A7A28; }
.food-items { border-top: 1px solid #F5EDE0; padding: 8px 16px 10px; }
.food-item { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 13px; border-bottom: 1px solid #FAF4EB; }
.food-item:last-child { border-bottom: none; }
.food-item-name { color: #4A3F32; font-weight: 500; }
.food-item-who { color: #A89478; font-size: 12px; }

.guest-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid #F5EDE0; }
.guest-row:last-child { border-bottom: none; }
.guest-name { font-weight: 600; font-size: 15px; color: #2D2418; }
.guest-detail { font-size: 13px; color: #8B7355; margin-top: 2px; }
.guest-badge { display: inline-block; margin-top: 4px; padding: 3px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; }
.guest-badge.food { background: #FEF3EC; color: #B8420F; }
.guest-badge.extras { background: #F0F7EA; color: #3D6B1F; }
.guest-actions { display: flex; gap: 2px; flex-shrink: 0; }
.guest-actions button { background: none; border: none; cursor: pointer; font-size: 16px; padding: 4px 6px; }

.extras-card { background: #fff; border-radius: 14px; padding: 20px; border: 1px solid #EDE3D3; box-shadow: 0 1px 3px rgba(45,36,24,0.05); margin-top: 14px; }
.extra-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-radius: 10px; margin-bottom: 8px; }
.extra-row:last-child { margin-bottom: 0; }
.extra-row.filled { background: #F0F7EA; border: 1px solid #D4E8C2; }
.extra-row.empty { background: #FDFAF6; border: 1px solid #EDE3D3; }
.extra-info { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #2D2418; }
.extra-who { font-size: 12px; color: #4A7A28; }
.extra-open { font-size: 12px; color: #C49555; font-weight: 600; }

.existing-box { margin-top: 12px; background: #FAF5ED; border-radius: 10px; padding: 10px 14px; border: 1px solid #EDE3D3; }
.existing-box .title { font-size: 12px; font-weight: 700; color: #8B7355; margin-bottom: 6px; }
.existing-box .item { font-size: 13px; color: #4A3F32; padding: 3px 0; }
.existing-box .item span { color: #8B7355; }

.admin-bar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
.admin-btn { background: #FDFAF6; border: 1px solid #EDE3D3; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; color: #A89478; cursor: pointer; font-family: inherit; }
.admin-btn.unlocked { background: #F0F7EA; border-color: #D4E8C2; color: #4A7A28; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.modal { background: #fff; border-radius: 16px; padding: 28px 24px; max-width: 320px; width: 100%; text-align: center; }
.modal h3 { margin: 0 0 4px; font-size: 18px; color: #2D2418; }
.modal p { font-size: 13px; color: #8B7355; margin: 0 0 16px; }
.modal input { width: 120px; padding: 12px 16px; border-radius: 10px; border: 1.5px solid #DDD2C0; font-size: 20px; font-family: inherit; text-align: center; letter-spacing: 8px; outline: none; }
.modal input.error { border-color: #D44; }
.modal .error-msg { font-size: 13px; color: #D44; margin: 8px 0 0; }
.modal-btns { display: flex; gap: 8px; margin-top: 16px; }
.modal-btns button { flex: 1; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
.modal-btns .cancel { border: 1.5px solid #DDD2C0; background: none; color: #6B5D4D; }
.modal-btns .unlock { border: none; background: linear-gradient(135deg, #B8420F 0%, #D46A25 100%); color: white; font-weight: 700; }

.success-card { background: linear-gradient(135deg, #F0F7EA 0%, #E8F5DC 100%); border: 1.5px solid #B8D99A; border-radius: 14px; padding: 32px 20px; text-align: center; margin-bottom: 14px; }
.success-card h2 { margin: 0 0 8px; font-size: 20px; color: #2D5A0F; }
.success-card p { margin: 0; font-size: 14px; color: #4A7A28; line-height: 1.5; }

.empty { text-align: center; padding: 48px 20px; color: #8B7355; }
.flex-row { display: flex; gap: 8px; }
.view { display: none; }
.view.active { display: block; }
</style>

</head>
<body>

<div id="app"></div>

<script>
const DB_URL = "https://cookout-rsvp-default-rtdb.firebaseio.com";
const ADMIN_PIN = "0523";

const FOOD_CATEGORIES = [
  { id: "rice", label: "Rice Dishes", emoji: "🍚", examples: "Jollof, fried rice, native rice, etc." },
  { id: "protein", label: "Proteins & Meats", emoji: "🍖", examples: "Suya, goat, chicken, fish, turkey, etc." },
  { id: "soup", label: "Soups & Stews", emoji: "🍲", examples: "Egusi, pepper soup, okra, etc." },
  { id: "appetizer", label: "Appetizers & Small Chops", emoji: "🥟", examples: "Meat pies, puff-puff, moi moi, spring rolls, etc." },
  { id: "sides", label: "Sides & Salads", emoji: "🥗", examples: "Plantain, coleslaw, beans, etc." },
  { id: "dessert", label: "Desserts", emoji: "🍰", examples: "Cake, chin chin, fruit platter, etc." },
  { id: "drinks", label: "Drinks & Beverages", emoji: "🥤", examples: "Zobo, chapman, fruit punch, malt, lemonade, ginger drink, etc." },
];

const EXTRAS = [
  { id: "games", label: "Outdoor Games", emoji: "⚽" },
  { id: "chairs", label: "Extra Chairs", emoji: "🪑" },
  { id: "canopy", label: "Canopy / Tent", emoji: "⛺" },
  { id: "speaker", label: "Speaker / Music", emoji: "🔊" },
  { id: "togo", label: "To-Go Containers", emoji: "📦" },
];

let rsvps = {};
let currentView = "home";
let adminUnlocked = false;
let editingId = null;
let form = { name: "", adults: 1, teens: 0, kids: 0, bringingFood: false, foodCategory: "", foodItem: "", servingSize: "", extras: [] };
let submitted = false;
let pollInterval = null;

// ─── Firebase REST API ───
async function loadRsvps() {
  try {
    const res = await fetch(`${DB_URL}/rsvps.json`);
    const data = await res.json();
    rsvps = data || {};
    render();
  } catch (e) { console.error("Load failed:", e); }
}

async function saveRsvp(id, data) {
  try {
    if (id) {
      await fetch(`${DB_URL}/rsvps/${id}.json`, { method: "PUT", body: JSON.stringify(data) });
    } else {
      const res = await fetch(`${DB_URL}/rsvps.json`, { method: "POST", body: JSON.stringify(data) });
      const result = await res.json();
      id = result.name;
    }
    await loadRsvps();
    return id;
  } catch (e) { console.error("Save failed:", e); }
}

async function deleteRsvp(id) {
  try {
    await fetch(`${DB_URL}/rsvps/${id}.json`, { method: "DELETE" });
    await loadRsvps();
  } catch (e) { console.error("Delete failed:", e); }
}

function getRsvpList() {
  return Object.entries(rsvps).map(([id, data]) => ({ id, ...data }));
}

function getTotals() {
  const list = getRsvpList();
  const adults = list.reduce((s, r) => s + (r.adults || 0), 0);
  const teens = list.reduce((s, r) => s + (r.teens || 0), 0);
  const kids = list.reduce((s, r) => s + (r.kids || 0), 0);
  return { families: list.length, adults, teens, kids, total: adults + teens + kids };
}

// ─── Rendering ───
function render() {
  const app = document.getElementById("app");
  switch (currentView) {
    case "home": app.innerHTML = renderHome(); break;
    case "board": app.innerHTML = renderBoard(); break;
    case "guests": app.innerHTML = renderGuests(); break;
    case "rsvp": app.innerHTML = submitted ? renderSuccess() : renderRsvpForm(); break;
  }
  bindEvents();
}

function renderTicker() {
  const t = getTotals();
  if (t.families === 0) return '';
  return `<div class="ticker">
    <span class="total">${t.total} attending</span>
    <span class="sep">|</span>
    <span>${t.adults} adults</span><span class="sep">·</span>
    <span>${t.teens} teens</span><span class="sep">·</span>
    <span>${t.kids} kids</span>
  </div>`;
}

function renderNav(active) {
  return `<div class="nav">
    <button class="${active === 'home' ? 'active' : ''}" data-nav="home">Home</button>
    <button class="${active === 'board' ? 'active' : ''}" data-nav="board">Food</button>
    <button class="${active === 'guests' ? 'active' : ''}" data-nav="guests">Guests</button>
    <button class="${active === 'rsvp' ? 'active' : ''}" data-nav="rsvp">RSVP</button>
  </div>`;
}

function renderFoodBoard(compact) {
  const list = getRsvpList();
  const cls = compact ? "compact" : "";
  return FOOD_CATEGORIES.map(cat => {
    const items = list.filter(r => r.foodCategory === cat.id);
    const badgeCls = items.length > 0 ? "filled" : "open";
    const badgeText = items.length > 0 ? `${items.length} signed up` : "Open";
    let itemsHtml = "";
    if (items.length > 0) {
      itemsHtml = `<div class="food-items">${items.map(item =>
        `<div class="food-item">
          <span class="food-item-name">${esc(item.foodItem || cat.label)}</span>
          <span class="food-item-who">${esc(item.name)}${item.servingSize ? ' · ' + esc(item.servingSize) : ''}</span>
        </div>`
      ).join("")}</div>`;
    }
    return `<div class="food-card ${cls}">
      <div class="food-header">
        <div class="food-info">
          <span class="food-emoji">${cat.emoji}</span>
          <div><div class="food-label">${cat.label}</div><div class="food-examples">${cat.examples}</div></div>
        </div>
        <span class="food-badge ${badgeCls}">${badgeText}</span>
      </div>
      ${itemsHtml}
    </div>`;
  }).join("");
}

function renderExtrasBoard() {
  const list = getRsvpList();
  const rows = EXTRAS.map(ex => {
    const people = list.filter(r => r.extras && r.extras.includes(ex.id));
    const filled = people.length > 0;
    return `<div class="extra-row ${filled ? 'filled' : 'empty'}">
      <div class="extra-info"><span>${ex.emoji}</span> ${ex.label}</div>
      ${filled
        ? `<div class="extra-who">${people.map(p => esc(p.name)).join(", ")}</div>`
        : `<span class="extra-open">Open</span>`}
    </div>`;
  }).join("");
  const hasAny = list.some(r => r.extras && r.extras.length > 0);
  return `<div class="extras-card">
    <div class="heading">🎯 Community Extras</div>
    ${!hasAny
      ? `<p style="font-size:13px;color:#A89478;">No extras signed up yet — games, chairs, speakers, and more are always welcome!</p>`
      : rows}
  </div>`;
}

function renderHome() {
  const t = getTotals();
  const hasExtras = getRsvpList().some(r => r.extras && r.extras.length > 0);
  return `
    <div class="header">
      <div style="font-size:42px;margin-bottom:6px;position:relative">🔥</div>
      <h1>Memorial Day Cookout</h1>
      <p class="subtitle">Saturday, May 23rd · 3–7 PM</p>
      <p class="address">21 Ridge Road, Whitehouse Station, NJ 08889 (Blackhouse w/white/brown accents)</p>
      <p class="detail">Bring a friend</p>
    </div>
    ${renderTicker()}
    <div class="body">
      <div class="card">
        <p class="desc-line">Join us for an afternoon of fellowship, food, music, and fun this Memorial Day weekend.</p>
        <p class="desc-line">Come as you are — solo, with friends, with the family!</p>
        <p class="desc-line">We invite you to bring your favorite dish or delicacy to share.</p>
        <p class="desc-line">Check the food board to see what's covered and where there's room.</p>
      </div>
      <button class="btn-primary" data-nav="rsvp">RSVP Now</button>
      <div class="spacer"></div>
      <button class="btn-ghost" data-nav="board">Browse Food Board →</button>
      <div class="spacer"></div>
      <button class="btn-ghost" data-nav="guests">See Who's Coming →</button>
      ${hasExtras ? renderExtrasBoard() : ''}
    </div>`;
}

function renderBoard() {
  return `
    <div class="header header-sm">
      <h1 class="sm">Food Board</h1>
      <p class="detail">See what's covered · Find where there's room</p>
    </div>
    ${renderTicker()}
    ${renderNav("board")}
    <div class="body">
      ${renderFoodBoard(false)}
      ${renderExtrasBoard()}
      <button class="btn-primary" data-nav="rsvp">RSVP & Claim a Dish</button>
    </div>`;
}

function renderGuests() {
  const list = getRsvpList();
  const t = getTotals();
  let content;
  if (list.length === 0) {
    content = `<div class="empty">
      <div style="font-size:48px;margin-bottom:12px">👥</div>
      <p style="font-size:15px;font-weight:600">No RSVPs yet</p>
      <button class="btn-ghost" style="width:auto;margin-top:12px" data-nav="rsvp">Be the first →</button>
    </div>`;
  } else {
    const adminBar = `<div class="admin-bar">
      ${adminUnlocked
        ? `<button class="admin-btn unlocked" id="adminToggle">🔓 Admin Mode · Lock</button>`
        : `<button class="admin-btn" id="adminToggle">🔒</button>`}
    </div>`;
    const guestRows = list.map(r => {
      let badges = '';
      if (r.foodCategory) {
        const cat = FOOD_CATEGORIES.find(c => c.id === r.foodCategory);
        badges += `<span class="guest-badge food">${cat ? cat.emoji : ''} ${esc(r.foodItem || (cat ? cat.label : ''))}</span> `;
      }
      if (r.extras && r.extras.length > 0) {
        const labels = r.extras.map(e => { const ex = EXTRAS.find(x => x.id === e); return ex ? ex.label : ''; }).join(", ");
        badges += `<span class="guest-badge extras">${labels}</span>`;
      }
      const actions = adminUnlocked ? `<div class="guest-actions">
        <button data-edit="${r.id}">✏️</button>
        <button data-delete="${r.id}" style="color:#C5A07A">✕</button>
      </div>` : '';
      return `<div class="guest-row">
        <div>
          <div class="guest-name">${esc(r.name)}</div>
          <div class="guest-detail">${r.adults} adult${r.adults !== 1 ? 's' : ''}${(r.teens || 0) > 0 ? ' · ' + r.teens + ' teen' + (r.teens !== 1 ? 's' : '') : ''}${r.kids > 0 ? ' · ' + r.kids + ' kid' + (r.kids !== 1 ? 's' : '') : ''}</div>
          ${badges}
        </div>
        ${actions}
      </div>`;
    }).join("");

    content = `
      <div class="stat-row">
        <div class="stat"><div class="stat-num">${t.adults}</div><div class="stat-lbl">Adults</div></div>
        <div class="stat"><div class="stat-num">${t.teens}</div><div class="stat-lbl">Teens</div></div>
        <div class="stat"><div class="stat-num">${t.kids}</div><div class="stat-lbl">Kids</div></div>
      </div>
      ${adminBar}
      <div class="card">${guestRows}</div>
      ${renderExtrasBoard()}`;
  }

  return `
    <div class="header header-sm">
      <h1 class="sm">Guest List</h1>
      <p class="detail">${t.families} ${t.families === 1 ? 'family' : 'families'} signed up</p>
    </div>
    ${renderTicker()}
    ${renderNav("guests")}
    <div class="body">${content}</div>
    <div id="pinModal" style="display:none"></div>`;
}

function renderRsvpForm() {
  const list = getRsvpList().filter(r => r.id !== editingId);
  const catButtons = FOOD_CATEGORIES.map(cat => {
    const ct = list.filter(r => r.foodCategory === cat.id).length;
    return `<button class="cat-btn ${form.foodCategory === cat.id ? 'active' : ''}" data-cat="${cat.id}">
      <div>${cat.emoji} ${cat.label}</div>
      ${ct > 0 ? `<div class="count">${ct} already signed up</div>` : ''}
    </button>`;
  }).join("");

  let existingHtml = '';
  if (form.foodCategory) {
    const existing = list.filter(r => r.foodCategory === form.foodCategory);
    if (existing.length > 0) {
      existingHtml = `<div class="existing-box">
        <div class="title">ALREADY SIGNED UP IN THIS CATEGORY</div>
        ${existing.map(e => {
          const cat = FOOD_CATEGORIES.find(c => c.id === e.foodCategory);
          return `<div class="item">${esc(e.foodItem || (cat ? cat.label : ''))} — <span>${esc(e.name)}</span></div>`;
        }).join("")}
      </div>`;
    }
  }

  const extraChips = EXTRAS.map(ex =>
    `<button class="chip ${form.extras.includes(ex.id) ? 'active' : ''}" data-extra="${ex.id}">${ex.emoji} ${ex.label}</button>`
  ).join("");

  const foodSection = `
    <div style="margin-top:16px">
      <label class="label" style="margin-top:0">Pick a category</label>
      <div class="cat-grid">${catButtons}</div>
      ${existingHtml}
      <label class="label">What are you planning to bring?</label>
      <input class="input" id="foodItem" placeholder="e.g. Jollof rice, pepper soup, zobo..." value="${esc(form.foodItem)}">
      <label class="label">Approximate Serving Size</label>
      <select class="select" id="servingSize">
        <option value="">Select...</option>
        <option value="Small (5–10)" ${form.servingSize === 'Small (5–10)' ? 'selected' : ''}>Small (feeds ~5–10)</option>
        <option value="Medium (10–20)" ${form.servingSize === 'Medium (10–20)' ? 'selected' : ''}>Medium (feeds ~10–20)</option>
        <option value="Large (20+)" ${form.servingSize === 'Large (20+)' ? 'selected' : ''}>Large (feeds ~20+)</option>
      </select>
    </div>`;

  return `
    <div class="header header-sm">
      <h1 class="sm">${editingId ? 'Update RSVP' : 'RSVP'}</h1>
      <p class="detail">Saturday, May 23rd · 3–7 PM</p>
    </div>
    ${renderTicker()}
    ${renderNav("rsvp")}
    <div class="body">
      <div class="card">
        <div class="heading">👋 Who's Coming?</div>
        <label class="label">Your Name / Family Name</label>
        <input class="input" id="rsvpName" placeholder="e.g. The Okafor Family" value="${esc(form.name)}">

        <label class="label">Adults</label>
        <div class="num-row">
          <button class="num-btn" data-num="adults" data-dir="-1">−</button>
          <span class="num-val" id="numAdults">${form.adults}</span>
          <button class="num-btn" data-num="adults" data-dir="1">+</button>
        </div>

        <label class="label">Teens (13–17)</label>
        <div class="num-row">
          <button class="num-btn" data-num="teens" data-dir="-1">−</button>
          <span class="num-val" id="numTeens">${form.teens}</span>
          <button class="num-btn" data-num="teens" data-dir="1">+</button>
        </div>

        <label class="label">Children (12 & under)</label>
        <div class="num-row">
          <button class="num-btn" data-num="kids" data-dir="-1">−</button>
          <span class="num-val" id="numKids">${form.kids}</span>
          <button class="num-btn" data-num="kids" data-dir="1">+</button>
        </div>
      </div>

      <div class="card">
        <div class="heading">🍽️ Bringing a Dish?</div>
        <p style="font-size:13px;color:#8B7355;margin:0 0 14px;line-height:1.5">
          We invite you to bring your favorite dish or delicacy. Pick a category below to see what's already covered.
        </p>
        ${foodSection}
      </div>

      <div class="card">
        <div class="heading">🎯 Bringing Any Extras?</div>
        <p style="font-size:13px;color:#8B7355;margin:0 0 12px;line-height:1.5">
          Also optional — but always appreciated!
        </p>
        <div class="chip-row">${extraChips}</div>
      </div>

      <button class="btn-primary" id="submitBtn" ${!form.name.trim() ? 'disabled' : ''}>${editingId ? 'Update RSVP' : 'Submit RSVP'}</button>

      <div style="margin-top:24px">
        <div class="heading" style="font-size:14px;color:#8B7355">📋 Current Food Board</div>
        ${renderFoodBoard(true)}
      </div>
    </div>`;
}

function renderSuccess() {
  return `
    <div class="header header-sm">
      <h1 class="sm">You're In!</h1>
      <p class="detail">See you on the 23rd</p>
    </div>
    ${renderTicker()}
    ${renderNav("rsvp")}
    <div class="body">
      <div class="success-card">
        <div style="font-size:48px;margin-bottom:10px">🎉</div>
        <h2>You're all set!</h2>
        <p>Your RSVP has been recorded. We look forward to seeing you and yours!</p>
      </div>
      <div class="flex-row">
        <button class="btn-ghost" data-nav="board">Food Board</button>
        <button class="btn-ghost" data-nav="guests">Guest List</button>
      </div>
      <div class="spacer"></div>
      <button class="btn-ghost" id="anotherRsvp">Submit Another RSVP</button>
    </div>`;
}

// ─── Event Binding ───
function bindEvents() {
  // Navigation
  document.querySelectorAll("[data-nav]").forEach(btn => {
    btn.addEventListener("click", () => {
      const target = btn.getAttribute("data-nav");
      if (target === "rsvp") { submitted = false; resetForm(); editingId = null; }
      currentView = target;
      render();
      window.scrollTo(0, 0);
    });
  });

  // Number inputs
  document.querySelectorAll("[data-num]").forEach(btn => {
    btn.addEventListener("click", () => {
      const field = btn.getAttribute("data-num");
      const dir = parseInt(btn.getAttribute("data-dir"));
      const min = field === "adults" ? 1 : 0;
      form[field] = Math.max(min, form[field] + dir);
      render();
    });
  });

  // Name input
  const nameInput = document.getElementById("rsvpName");
  if (nameInput) {
    nameInput.addEventListener("input", () => { form.name = nameInput.value; });
    nameInput.addEventListener("change", () => { form.name = nameInput.value; });
  }

  // Category buttons
  document.querySelectorAll("[data-cat]").forEach(btn => {
    btn.addEventListener("click", () => {
      form.foodCategory = btn.getAttribute("data-cat");
      render();
    });
  });

  // Food item input
  const foodInput = document.getElementById("foodItem");
  if (foodInput) {
    foodInput.addEventListener("input", () => { form.foodItem = foodInput.value; });
    foodInput.addEventListener("change", () => { form.foodItem = foodInput.value; });
  }

  // Serving size
  const servingSelect = document.getElementById("servingSize");
  if (servingSelect) {
    servingSelect.addEventListener("change", () => { form.servingSize = servingSelect.value; });
  }

  // Extra chips
  document.querySelectorAll("[data-extra]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-extra");
      if (form.extras.includes(id)) {
        form.extras = form.extras.filter(e => e !== id);
      } else {
        form.extras = [...form.extras, id];
      }
      render();
    });
  });

  // Submit
  const submitBtn = document.getElementById("submitBtn");
  if (submitBtn) {
    submitBtn.addEventListener("click", async () => {
      if (!form.name.trim()) return;
      const entry = {
        name: form.name.trim(),
        adults: Math.max(1, form.adults),
        teens: Math.max(0, form.teens),
        kids: Math.max(0, form.kids),
        foodCategory: form.foodCategory || "",
        foodItem: form.foodItem.trim() || "",
        servingSize: form.servingSize || "",
        extras: form.extras,
        ts: new Date().toISOString(),
      };
      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";
      await saveRsvp(editingId, entry);
      submitted = true;
      editingId = null;
      resetForm();
      render();
    });
  }

  // Another RSVP
  const anotherBtn = document.getElementById("anotherRsvp");
  if (anotherBtn) {
    anotherBtn.addEventListener("click", () => { submitted = false; resetForm(); render(); });
  }

  // Admin toggle
  const adminToggle = document.getElementById("adminToggle");
  if (adminToggle) {
    adminToggle.addEventListener("click", () => {
      if (adminUnlocked) {
        adminUnlocked = false;
        render();
      } else {
        showPinModal();
      }
    });
  }

  // Edit buttons
  document.querySelectorAll("[data-edit]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-edit");
      const r = rsvps[id];
      if (!r) return;
      editingId = id;
      form = {
        name: r.name, adults: r.adults, teens: r.teens || 0, kids: r.kids,
        bringingFood: !!r.foodCategory, foodCategory: r.foodCategory || "",
        foodItem: r.foodItem || "", servingSize: r.servingSize || "",
        extras: r.extras || [],
      };
      submitted = false;
      currentView = "rsvp";
      render();
      window.scrollTo(0, 0);
    });
  });

  // Delete buttons
  document.querySelectorAll("[data-delete]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.getAttribute("data-delete");
      await deleteRsvp(id);
    });
  });
}

function showPinModal() {
  let pin = "";
  let error = false;
  const modal = document.getElementById("pinModal");
  if (!modal) return;

  function renderModal() {
    modal.style.display = "block";
    modal.innerHTML = `<div class="modal-overlay">
      <div class="modal">
        <div style="font-size:32px;margin-bottom:8px">🔒</div>
        <h3>Admin Access</h3>
        <p>Enter PIN to manage guest list</p>
        <input type="password" inputmode="numeric" maxlength="4" id="pinInput" class="${error ? 'error' : ''}" value="${pin}" placeholder="PIN">
        ${error ? '<div class="error-msg">Incorrect PIN</div>' : ''}
        <div class="modal-btns">
          <button class="cancel" id="pinCancel">Cancel</button>
          <button class="unlock" id="pinUnlock">Unlock</button>
        </div>
      </div>
    </div>`;

    document.getElementById("pinInput").focus();
    document.getElementById("pinInput").addEventListener("input", (e) => {
      pin = e.target.value.replace(/\D/g, "");
      error = false;
    });
    document.getElementById("pinCancel").addEventListener("click", () => { modal.style.display = "none"; });
    document.getElementById("pinUnlock").addEventListener("click", () => {
      if (pin === ADMIN_PIN) {
        adminUnlocked = true;
        modal.style.display = "none";
        render();
      } else {
        error = true;
        renderModal();
      }
    });
  }
  renderModal();
}

function resetForm() {
  form = { name: "", adults: 1, teens: 0, kids: 0, bringingFood: false, foodCategory: "", foodItem: "", servingSize: "", extras: [] };
}

function esc(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

// ─── Init ───
loadRsvps();
pollInterval = setInterval(loadRsvps, 10000);
</script>
