<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Memorial Day Cookout</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background: #FBFBFD; color: #1D1D1F; min-height: 100vh; -webkit-font-smoothing: antialiased; }

.nav { position: sticky; top: 0; z-index: 50; background: rgba(251,251,253,0.82); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0,0,0,0.06); display: flex; justify-content: center; gap: 36px; padding: 14px 20px; }
.nav button { background: none; border: none; cursor: pointer; font-size: 12px; font-weight: 400; color: #86868B; font-family: inherit; letter-spacing: 0.8px; text-transform: uppercase; padding: 4px 0; }
.nav button.active { font-weight: 600; color: #1D1D1F; }

.ticker { display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; padding: 12px 20px; font-size: 12px; font-weight: 500; letter-spacing: 0.2px; color: #86868B; background: #F5F5F7; }
.ticker .total { color: #B8420F; font-weight: 700; cursor: pointer; }
.ticker .sep { opacity: 0.3; }
.ticker.hidden { display: none; }

.body { max-width: 540px; margin: 0 auto; padding: 48px 24px 60px; }
.body-home { max-width: 600px; margin: 0 auto; padding: 40px 24px 60px; text-align: center; }

.card { background: #fff; border-radius: 20px; padding: 24px; margin-bottom: 12px; border: 1px solid rgba(0,0,0,0.06); }
.card-title { font-size: 17px; font-weight: 700; color: #1D1D1F; margin-bottom: 16px; letter-spacing: -0.3px; }

.page-title { font-size: 40px; font-weight: 800; color: #1D1D1F; letter-spacing: -1.5px; margin-bottom: 8px; text-align: center; }
.page-sub { font-size: 15px; color: #86868B; text-align: center; margin-bottom: 40px; }

.label { display: block; font-size: 13px; font-weight: 500; color: #86868B; margin-bottom: 6px; margin-top: 18px; }
.label:first-child { margin-top: 0; }
.input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.1); background: #F5F5F7; font-size: 15px; font-family: inherit; color: #1D1D1F; outline: none; transition: border-color 0.2s; }
.input:focus { border-color: #B8420F; }
.select { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.1); background: #F5F5F7; font-size: 15px; font-family: inherit; color: #1D1D1F; outline: none; appearance: none; }

.num-row { display: flex; align-items: center; gap: 16px; }
.num-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); background: #F5F5F7; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #424245; font-family: inherit; transition: background 0.2s; }
.num-btn:active { background: #E8E8ED; }
.num-val { font-size: 18px; font-weight: 700; min-width: 24px; text-align: center; color: #1D1D1F; }

.cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cat-btn { padding: 14px 12px; border-radius: 14px; border: 1px solid rgba(0,0,0,0.08); background: #fff; cursor: pointer; font-size: 13px; font-weight: 500; color: #424245; font-family: inherit; text-align: left; transition: all 0.2s; }
.cat-btn.active { border-color: #B8420F; background: #FEF3EC; color: #B8420F; font-weight: 600; }
.cat-btn .count { font-size: 11px; color: #86868B; margin-top: 2px; }
.cat-btn .emoji { font-size: 18px; }

.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 14px; border-radius: 20px; border: 1px solid rgba(0,0,0,0.08); background: #fff; cursor: pointer; font-size: 13px; font-weight: 400; color: #424245; font-family: inherit; transition: all 0.2s; }
.chip.active { border-color: #34A853; background: #F0F7EA; font-weight: 600; color: #1B6D2B; }

.btn-primary { width: 100%; padding: 18px; border-radius: 14px; border: none; background: #1D1D1F; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit; letter-spacing: -0.2px; transition: transform 0.15s, opacity 0.15s; }
.btn-primary:active { transform: scale(0.98); opacity: 0.9; }
.btn-primary:disabled { background: #C7C7CC; cursor: not-allowed; }
.btn-link { width: 100%; padding: 14px; border-radius: 14px; border: none; background: transparent; color: #0066CC; font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit; }
.btn-ghost { background: #fff; border: 1px solid rgba(0,0,0,0.08); border-radius: 14px; padding: 14px 20px; font-size: 14px; font-weight: 500; cursor: pointer; color: #424245; font-family: inherit; width: 100%; transition: background 0.2s; }
.btn-ghost:active { background: #F5F5F7; }

.stat-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 24px; }
.stat { text-align: center; padding: 22px 8px; background: #fff; border-radius: 16px; border: 1px solid rgba(0,0,0,0.06); }
.stat-num { font-size: 32px; font-weight: 800; color: #1D1D1F; line-height: 1; }
.stat-lbl { font-size: 11px; color: #86868B; margin-top: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

.food-card { background: #fff; border-radius: 16px; border: 1px solid rgba(0,0,0,0.06); margin-bottom: 6px; overflow: hidden; }
.food-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.2s; }
.food-header:active { background: #FAFAFA; }
.food-info { display: flex; align-items: center; gap: 14px; }
.food-emoji { font-size: 26px; }
.food-label { font-weight: 600; font-size: 15px; color: #1D1D1F; }
.food-badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.food-badge.open { background: #F5F5F7; color: #86868B; }
.food-badge.filled { background: #FEF3EC; color: #B8420F; }
.food-items { border-top: 1px solid rgba(0,0,0,0.04); padding: 4px 20px 12px; background: #FAFAFA; }
.food-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-size: 14px; border-bottom: 1px solid rgba(0,0,0,0.04); }
.food-item:last-child { border-bottom: none; }
.food-item-name { color: #1D1D1F; font-weight: 500; }
.food-item-who { color: #86868B; font-size: 12px; }

.food-card.compact { margin-bottom: 4px; }
.food-card.compact .food-header { padding: 12px 16px; }
.food-card.compact .food-emoji { font-size: 20px; }
.food-card.compact .food-label { font-size: 14px; }

.guest-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 16px 0; border-bottom: 1px solid rgba(0,0,0,0.04); }
.guest-row:last-child { border-bottom: none; }
.guest-name { font-size: 15px; font-weight: 600; color: #1D1D1F; }
.guest-detail { font-size: 13px; color: #86868B; margin-top: 2px; }
.guest-badge { display: inline-block; margin-top: 4px; margin-right: 4px; padding: 4px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.guest-badge.food { background: #FEF3EC; color: #B8420F; }
.guest-badge.extras { background: #F0F7EA; color: #1B6D2B; }
.guest-actions { display: flex; gap: 2px; flex-shrink: 0; }
.guest-actions button { background: none; border: none; cursor: pointer; font-size: 16px; padding: 4px 6px; opacity: 0.4; transition: opacity 0.2s; }
.guest-actions button:hover { opacity: 1; }

.extras-card { background: #fff; border-radius: 20px; padding: 24px; border: 1px solid rgba(0,0,0,0.06); margin-top: 16px; }
.extra-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-radius: 12px; margin-bottom: 6px; }
.extra-row:last-child { margin-bottom: 0; }
.extra-row.filled { background: #F0F7EA; border: 1px solid rgba(52,168,83,0.12); }
.extra-row.empty { background: #F5F5F7; border: 1px solid rgba(0,0,0,0.04); }
.extra-info { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #1D1D1F; }
.extra-who { font-size: 12px; color: #1B6D2B; }
.extra-open { font-size: 12px; color: #86868B; font-weight: 500; }

.dish-field { background: #FAFAFA; border: 1px solid rgba(0,0,0,0.06); border-radius: 14px; padding: 16px; margin-top: 10px; }
.dish-field-title { font-size: 14px; font-weight: 700; color: #B8420F; margin-bottom: 10px; }
.existing-box { margin-bottom: 10px; background: #F5F5F7; border-radius: 10px; padding: 10px 14px; border: 1px solid rgba(0,0,0,0.04); }
.existing-box .etitle { font-size: 11px; font-weight: 700; color: #86868B; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.existing-box .eitem { font-size: 13px; color: #424245; padding: 3px 0; }
.existing-box .eitem span { color: #86868B; }

.admin-bar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
.admin-btn { background: #F5F5F7; border: 1px solid rgba(0,0,0,0.06); border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 500; color: #86868B; cursor: pointer; font-family: inherit; }
.admin-btn.unlocked { background: #F0F7EA; border-color: rgba(52,168,83,0.15); color: #1B6D2B; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.modal { background: #fff; border-radius: 20px; padding: 32px 28px; max-width: 320px; width: 100%; text-align: center; }
.modal h3 { margin: 0 0 4px; font-size: 18px; color: #1D1D1F; }
.modal p { font-size: 13px; color: #86868B; margin: 0 0 16px; }
.modal input { width: 120px; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.1); background: #F5F5F7; font-size: 20px; font-family: inherit; text-align: center; letter-spacing: 8px; outline: none; }
.modal input.error { border-color: #FF3B30; }
.modal .error-msg { font-size: 13px; color: #FF3B30; margin: 8px 0 0; }
.modal-btns { display: flex; gap: 8px; margin-top: 16px; }
.modal-btns button { flex: 1; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
.modal-btns .cancel { border: 1px solid rgba(0,0,0,0.08); background: #fff; color: #424245; }
.modal-btns .unlock { border: none; background: #1D1D1F; color: white; }

.success-card { background: #fff; border: 1px solid rgba(52,168,83,0.15); border-radius: 20px; padding: 40px 24px; text-align: center; margin-bottom: 16px; }
.success-card h2 { margin: 0 0 8px; font-size: 22px; color: #1D1D1F; letter-spacing: -0.5px; }
.success-card p { margin: 0; font-size: 15px; color: #86868B; line-height: 1.5; }

.lookup-card { background: #F5F5F7; border: 1px solid rgba(0,0,0,0.04); border-radius: 16px; padding: 20px; margin-bottom: 12px; }

.flex-row { display: flex; gap: 8px; }
.spacer { height: 12px; }
</style>

</head>
<body>

<div id="app"></div>

<script>
const DB_URL = "https://cookout-rsvp-default-rtdb.firebaseio.com";
const ADMIN_PIN = "0523";

const EMAILJS_PUBLIC_KEY = "lTqtiCTbkRv43PzBQ";
const EMAILJS_SERVICE_ID = "service_9q42hxc";
const EMAILJS_TEMPLATE_ID = "template_rplm4eh";
const EMAILJS_ADMIN_TEMPLATE_ID = "template_6ugpk7s";
emailjs.init(EMAILJS_PUBLIC_KEY);

function getDishes(rsvp) {
  if (rsvp.dishes && rsvp.dishes.length > 0) return rsvp.dishes;
  if (rsvp.foodCategory) return [{ category: rsvp.foodCategory, item: rsvp.foodItem || "", servingSize: rsvp.servingSize || "" }];
  return [];
}

function buildRsvpSummary(entry) {
  let parts = [];
  parts.push(`${entry.adults} adult${entry.adults !== 1 ? 's' : ''}`);
  if (entry.teens > 0) parts.push(`${entry.teens} teen${entry.teens !== 1 ? 's' : ''}`);
  if (entry.kids > 0) parts.push(`${entry.kids} kid${entry.kids !== 1 ? 's' : ''}`);
  let summary = parts.join(', ');
  const dishes = getDishes(entry);
  if (dishes.length > 0) {
    const dishNames = dishes.map(d => d.item || FOOD_CATEGORIES.find(c => c.id === d.category)?.label || d.category).join(', ');
    summary += ` · Bringing: ${dishNames}`;
  }
  return summary;
}

async function sendConfirmationEmail(entry) {
  if (!entry.email) return;
  try {
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, { to_email: entry.email, name: entry.name, rsvp_summary: buildRsvpSummary(entry) });
  } catch (e) { console.error("Email send failed:", e); }
}

async function sendAdminNotification(entry) {
  try {
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_ADMIN_TEMPLATE_ID, { name: entry.name, to_email: entry.email || "Not provided", rsvp_summary: buildRsvpSummary(entry) });
  } catch (e) { console.error("Admin notification failed:", e); }
}

const FOOD_CATEGORIES = [
  { id: "rice", label: "Rice & Starches", emoji: "🍚", examples: "Jollof, fried rice, boiled yam, fried yam, native rice, etc." },
  { id: "protein", label: "Proteins & Meats", emoji: "🍖", examples: "Suya, goat, chicken, fish, turkey, etc." },
  { id: "soup", label: "Soups & Stews", emoji: "🍲", examples: "Egusi, pepper soup, okra, etc." },
  { id: "swallow", label: "Swallow", emoji: "🫓", examples: "Pounded yam, eba, amala, fufu, semovita, etc." },
  { id: "appetizer", label: "Appetizers & Small Chops", emoji: "🥟", examples: "Meat pies, puff-puff, moi moi, spring rolls, etc." },
  { id: "sides", label: "Sides & Salads", emoji: "🥗", examples: "Plantain, coleslaw, beans, etc." },
  { id: "dessert", label: "Desserts", emoji: "🍰", examples: "Cake, chin chin, fruit platter, etc." },
  { id: "drinks", label: "Drinks & Beverages", emoji: "🥤", examples: "Zobo, chapman, fruit punch, malt, lemonade, ginger drink, etc." },
];

const EXTRAS = [
  { id: "games", label: "Outdoor Games", emoji: "⚽" },
  { id: "chairs", label: "Extra Chairs", emoji: "🪑" },
  { id: "togo", label: "To-Go Containers", emoji: "📦" },
];

let rsvps = {};
let currentView = "home";
let adminUnlocked = false;
let editingId = null;
let lookupEmail = "";
let lookupError = "";
let form = { name: "", email: "", adults: 1, teens: 0, kids: 0, dishes: [], extras: [] };
let submitted = false;
let expandedCat = null;
let pollInterval = null;

async function loadRsvps() {
  try { const res = await fetch(`${DB_URL}/rsvps.json`); const data = await res.json(); rsvps = data || {}; render(); }
  catch (e) { console.error("Load failed:", e); }
}
async function saveRsvp(id, data) {
  try {
    if (id) { await fetch(`${DB_URL}/rsvps/${id}.json`, { method: "PUT", body: JSON.stringify(data) }); }
    else { const res = await fetch(`${DB_URL}/rsvps.json`, { method: "POST", body: JSON.stringify(data) }); id = (await res.json()).name; }
    await loadRsvps(); return id;
  } catch (e) { console.error("Save failed:", e); }
}
async function deleteRsvp(id) { try { await fetch(`${DB_URL}/rsvps/${id}.json`, { method: "DELETE" }); await loadRsvps(); } catch (e) { console.error(e); } }

function getRsvpList() { return Object.entries(rsvps).map(([id, data]) => ({ id, ...data })); }
function getTotals() {
  const list = getRsvpList();
  return { families: list.length, adults: list.reduce((s,r) => s + (r.adults||0), 0), teens: list.reduce((s,r) => s + (r.teens||0), 0), kids: list.reduce((s,r) => s + (r.kids||0), 0), total: list.reduce((s,r) => s + (r.adults||0) + (r.teens||0) + (r.kids||0), 0) };
}
function esc(str) { const d = document.createElement("div"); d.textContent = str || ""; return d.innerHTML; }
function resetForm() { form = { name: "", email: "", adults: 1, teens: 0, kids: 0, dishes: [], extras: [] }; }

function render() {
  const app = document.getElementById("app");
  switch (currentView) {
    case "home": app.innerHTML = renderHome(); break;
    case "board": app.innerHTML = renderBoard(); break;
    case "guests": app.innerHTML = renderGuests(); break;
    case "rsvp": app.innerHTML = submitted ? renderSuccess() : renderRsvpForm(); break;
  }
  bindEvents();
}

function renderTicker() {
  const t = getTotals();
  if (t.families === 0) return '';
  return `<div class="ticker">
    <span class="total" data-nav="guests">${t.total} attending</span>
    <span class="sep">|</span><span>${t.adults} adults</span><span class="sep">·</span>
    <span>${t.teens} teens</span><span class="sep">·</span><span>${t.kids} kids</span>
  </div>`;
}

function renderNav(active) {
  return `<div class="nav">
    ${["home","board","guests","rsvp"].map(v => `<button class="${active===v?'active':''}" data-nav="${v}">${v === 'board' ? 'food' : v}</button>`).join("")}
  </div>`;
}

function renderFoodBoard(compact) {
  const list = getRsvpList();
  const cls = compact ? "compact" : "";
  return FOOD_CATEGORIES.map(cat => {
    const catItems = [];
    list.forEach(r => { getDishes(r).forEach(d => { if (d.category === cat.id) catItems.push({ ...d, name: r.name }); }); });
    const isExpanded = !compact && expandedCat === cat.id && catItems.length > 0;
    let itemsHtml = "";
    if (isExpanded) {
      itemsHtml = `<div class="food-items">${catItems.map(item =>
        `<div class="food-item"><span class="food-item-name">${esc(item.item || cat.label)}</span><span class="food-item-who">${item.servingSize ? esc(item.servingSize) : ''}</span></div>`
      ).join("")}</div>`;
    } else if (compact && catItems.length > 0) {
      itemsHtml = `<div class="food-items">${catItems.map(item =>
        `<div class="food-item"><span class="food-item-name">${esc(item.item || cat.label)}</span></div>`
      ).join("")}</div>`;
    }
    return `<div class="food-card ${cls}">
      <div class="food-header" ${!compact && catItems.length > 0 ? `data-expand="${cat.id}"` : ''}>
        <div class="food-info"><span class="food-emoji">${cat.emoji}</span><span class="food-label">${cat.label}</span></div>
        <span class="food-badge ${catItems.length > 0 ? 'filled' : 'open'}">${catItems.length > 0 ? catItems.length : 'Open'}</span>
      </div>${itemsHtml}</div>`;
  }).join("");
}

function renderExtrasBoard() {
  const list = getRsvpList();
  const rows = EXTRAS.map(ex => {
    const people = list.filter(r => r.extras && r.extras.includes(ex.id));
    return `<div class="extra-row ${people.length > 0 ? 'filled' : 'empty'}">
      <div class="extra-info"><span>${ex.emoji}</span> ${ex.label}</div>
      ${people.length > 0 ? `<div class="extra-who">${people.map(p => esc(p.name)).join(", ")}</div>` : `<span class="extra-open">Open</span>`}
    </div>`;
  }).join("");
  return `<div class="extras-card"><div class="card-title">🎯 Community Extras</div>${list.some(r => r.extras?.length > 0) ? rows : '<p style="font-size:13px;color:#86868B">No extras signed up yet.</p>'}</div>`;
}

function renderHome() {
  const t = getTotals();
  return `
    ${renderTicker()}
    <div class="body-home">
      <div style="margin-bottom:12px"><span style="font-size:48px">🔥</span></div>
      <p style="font-size:11px;font-weight:700;letter-spacing:5px;text-transform:uppercase;color:#B8420F;margin-bottom:12px">Memorial Day Weekend</p>
      <h1 style="font-size:48px;font-weight:800;line-height:1;color:#1D1D1F;letter-spacing:-2px;margin-bottom:16px">Cookout.</h1>
      <p style="font-size:19px;color:#1D1D1F;font-weight:600;line-height:1.5;margin-bottom:4px">Saturday, May 23rd · 4–8 PM</p>
      <p style="font-size:14px;color:#86868B;margin-bottom:28px">Address shared upon RSVP</p>
      <div style="max-width:420px;margin:0 auto 28px">
        <p style="font-size:16px;color:#424245;line-height:1.6;margin-bottom:14px">Join us for fellowship, food, music, and fun this Memorial Day weekend.</p>
        <p style="font-size:17px;color:#1D1D1F;font-weight:700;line-height:1.4;margin-bottom:14px"><strong>Come as you are — solo, with friends, with the family!</strong></p>
        <p style="font-size:15px;color:#6E6E73;line-height:1.5;margin-bottom:6px">We invite you to bring your favorite dish or delicacy to share.</p>
        <p style="font-size:14px;color:#6E6E73;line-height:1.5;margin-bottom:12px">Check the food board to see what's covered and where there's room.</p>
        <p style="font-size:13px;color:#B8420F;font-weight:600">Please RSVP by Sunday, May 17th to help us plan.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;max-width:320px;margin:0 auto">
        <button class="btn-primary" data-nav="rsvp">RSVP Now</button>
        <button class="btn-link" data-nav="board">Browse Food Board →</button>
        <button class="btn-link" data-nav="guests">See Who's Coming →</button>
      </div>
      ${getRsvpList().some(r => r.extras?.length > 0) ? `<div style="max-width:420px;margin:24px auto 0">${renderExtrasBoard()}</div>` : ''}
    </div>`;
}

function renderBoard() {
  return `${renderNav("board")}${renderTicker()}
    <div class="body">
      <h2 class="page-title">Food Board</h2>
      <p class="page-sub">Tap a category to see details.</p>
      ${renderFoodBoard(false)}
      <div style="margin-top:16px">${renderExtrasBoard()}</div>
      <button class="btn-primary" style="margin-top:24px" data-nav="rsvp">RSVP & Claim a Dish</button>
    </div>`;
}

function renderGuests() {
  const list = getRsvpList(); const t = getTotals();
  let content;
  if (list.length === 0) {
    content = `<div style="text-align:center;padding:60px 20px;color:#86868B"><div style="font-size:48px;margin-bottom:16px">👥</div><p style="font-size:16px;font-weight:600">No RSVPs yet</p><button class="btn-link" style="margin-top:12px" data-nav="rsvp">Be the first →</button></div>`;
  } else {
    const adminBar = `<div class="admin-bar">${adminUnlocked ? `<button class="admin-btn unlocked" id="adminToggle">🔓 Admin · Lock</button>` : `<button class="admin-btn" id="adminToggle">🔒</button>`}</div>`;
    const guestRows = list.map(r => {
      let badges = '';
      const actions = adminUnlocked ? `<div class="guest-actions"><button data-edit="${r.id}">✏️</button><button data-delete="${r.id}">✕</button></div>` : '';
      return `<div class="guest-row"><div><div class="guest-name">${esc(r.name)}</div><div class="guest-detail">${r.adults} adult${r.adults!==1?'s':''}${(r.teens||0)>0?' · '+r.teens+' teen'+(r.teens!==1?'s':''):''}${r.kids>0?' · '+r.kids+' kid'+(r.kids!==1?'s':''):''}</div></div>${actions}</div>`;
    }).join("");
    content = `
      <div class="stat-row">
        <div class="stat"><div class="stat-num">${t.adults}</div><div class="stat-lbl">Adults</div></div>
        <div class="stat"><div class="stat-num">${t.teens}</div><div class="stat-lbl">Teens</div></div>
        <div class="stat"><div class="stat-num">${t.kids}</div><div class="stat-lbl">Kids</div></div>
      </div>${adminBar}<div class="card" style="padding:4px 20px">${guestRows}</div>${renderExtrasBoard()}`;
  }
  return `${renderNav("guests")}${renderTicker()}<div class="body"><h2 class="page-title">Guests</h2><p class="page-sub">${t.families} ${t.families===1?'RSVP':'RSVPs'}</p>${content}</div><div id="pinModal" style="display:none"></div>`;
}

function renderRsvpForm() {
  const list = getRsvpList().filter(r => r.id !== editingId);
  const catButtons = FOOD_CATEGORIES.map(cat => {
    const isSelected = form.dishes.some(d => d.category === cat.id);
    let ct = 0; list.forEach(r => { getDishes(r).forEach(d => { if (d.category === cat.id) ct++; }); });
    return `<button class="cat-btn ${isSelected ? 'active' : ''}" data-cat-toggle="${cat.id}"><span class="emoji">${cat.emoji}</span> ${cat.label}${ct > 0 ? `<div class="count">${ct} signed up</div>` : ''}</button>`;
  }).join("");

  const dishFields = form.dishes.map((dish, idx) => {
    const cat = FOOD_CATEGORIES.find(c => c.id === dish.category);
    if (!cat) return '';
    const existingItems = [];
    list.forEach(r => { getDishes(r).forEach(d => { if (d.category === cat.id) existingItems.push({ item: d.item, name: r.name }); }); });
    const existingHtml = existingItems.length > 0 ? `<div class="existing-box"><div class="etitle">Already in ${cat.label}</div>${existingItems.map(e => `<div class="eitem">${esc(e.item || cat.label)} — <span>${esc(e.name)}</span></div>`).join("")}</div>` : '';
    return `<div class="dish-field"><div class="dish-field-title">${cat.emoji} ${cat.label}</div>${existingHtml}
      <label class="label" style="margin-top:0">What are you bringing?</label>
      <input class="input dish-item" data-dish-idx="${idx}" placeholder="e.g. ${cat.examples.replace(', etc.','').split(', ').slice(0,2).join(', ')}..." value="${esc(dish.item)}">
      <label class="label">Serving Size</label>
      <select class="select dish-size" data-dish-idx="${idx}">
        <option value="">Select...</option>
        <option value="Small (5–10)" ${dish.servingSize==='Small (5–10)'?'selected':''}>Small (5–10)</option>
        <option value="Medium (10–20)" ${dish.servingSize==='Medium (10–20)'?'selected':''}>Medium (10–20)</option>
        <option value="Large (20+)" ${dish.servingSize==='Large (20+)'?'selected':''}>Large (20+)</option>
        <option value="Half Pan" ${dish.servingSize==='Half Pan'?'selected':''}>Half Pan</option>
        <option value="Full Pan" ${dish.servingSize==='Full Pan'?'selected':''}>Full Pan</option>
      </select></div>`;
  }).join("");

  const extraChips = EXTRAS.map(ex => `<button class="chip ${form.extras.includes(ex.id)?'active':''}" data-extra="${ex.id}">${ex.emoji} ${ex.label}</button>`).join("");

  return `${renderNav("rsvp")}${renderTicker()}
    <div class="body">
      <h2 class="page-title">${editingId ? 'Update RSVP' : 'RSVP'}</h2>
      <p style="font-size:15px;color:#86868B;text-align:center;margin-bottom:4px">Saturday, May 23rd · 4–8 PM</p>
      <p style="font-size:12px;color:#B8420F;text-align:center;font-weight:600;margin-bottom:40px">Please RSVP by Sunday, May 17th</p>

      ${!editingId ? `<div class="lookup-card">
        <div style="font-size:14px;font-weight:600;color:#424245;margin-bottom:6px">Already RSVP'd?</div>
        <p style="font-size:13px;color:#86868B;margin:0 0 10px;line-height:1.4">Enter your email to update your RSVP.</p>
        <div style="display:flex;gap:8px"><input class="input" id="lookupEmail" type="email" placeholder="Your email" value="${esc(lookupEmail)}" style="flex:1"><button class="btn-ghost" id="lookupBtn" style="width:auto;padding:12px 16px;white-space:nowrap">Look Up</button></div>
        ${lookupError ? `<p style="font-size:13px;color:#FF3B30;margin:8px 0 0">${lookupError}</p>` : ''}
      </div>` : ''}

      <div class="card">
        <h3 class="card-title">Who's Coming?</h3>
        <label class="label">Name / Family Name</label>
        <input class="input" id="rsvpName" placeholder="e.g. The Okafor Family" value="${esc(form.name)}">
        <label class="label">Email</label>
        <input class="input" id="rsvpEmail" type="email" placeholder="e.g. name@email.com" value="${esc(form.email)}">
        <label class="label">Adults</label>
        <div class="num-row"><button class="num-btn" data-num="adults" data-dir="-1">−</button><span class="num-val">${form.adults}</span><button class="num-btn" data-num="adults" data-dir="1">+</button></div>
        <label class="label">Teens (13–17)</label>
        <div class="num-row"><button class="num-btn" data-num="teens" data-dir="-1">−</button><span class="num-val">${form.teens}</span><button class="num-btn" data-num="teens" data-dir="1">+</button></div>
        <label class="label">Children (12 & under)</label>
        <div class="num-row"><button class="num-btn" data-num="kids" data-dir="-1">−</button><span class="num-val">${form.kids}</span><button class="num-btn" data-num="kids" data-dir="1">+</button></div>
      </div>

      <div class="card">
        <h3 class="card-title">Bringing a Dish?</h3>
        <p style="font-size:14px;color:#86868B;margin-bottom:16px;line-height:1.5">We invite you to bring your favorite dish or delicacy. Tap one or more categories.</p>
        <div class="cat-grid">${catButtons}</div>
        ${dishFields}
      </div>

      <div class="card">
        <h3 class="card-title">Bringing Any Extras?</h3>
        <p style="font-size:13px;color:#86868B;margin:0 0 12px;line-height:1.5">Optional — but always appreciated!</p>
        <div class="chip-row">${extraChips}</div>
      </div>

      <button class="btn-primary" id="submitBtn" ${!form.name.trim()||!form.email.trim()?'disabled':''}>${editingId?'Update RSVP':'Submit RSVP'}</button>

      <div style="margin-top:32px">
        <p style="font-size:14px;font-weight:600;color:#86868B;margin-bottom:12px">📋 Current Food Board</p>
        ${renderFoodBoard(true)}
      </div>
    </div>`;
}

function renderSuccess() {
  return `${renderNav("rsvp")}${renderTicker()}
    <div class="body">
      <div class="success-card">
        <div style="font-size:48px;margin-bottom:12px">🎉</div>
        <h2>You're all set!</h2>
        <p>Your RSVP has been recorded. We look forward to seeing you!</p>
      </div>
      <div class="flex-row"><button class="btn-ghost" data-nav="board">Food Board</button><button class="btn-ghost" data-nav="guests">Guest List</button></div>
      <div class="spacer"></div>
      <button class="btn-ghost" id="anotherRsvp">Submit Another RSVP</button>
    </div>`;
}

// ─── Events ───
function bindEvents() {
  document.querySelectorAll("[data-nav]").forEach(btn => {
    btn.addEventListener("click", () => {
      const target = btn.getAttribute("data-nav");
      if (target === "rsvp") { submitted = false; resetForm(); editingId = null; lookupEmail = ""; lookupError = ""; }
      currentView = target === "board" ? "board" : target;
      expandedCat = null;
      render(); window.scrollTo(0, 0);
    });
  });
  document.querySelectorAll("[data-expand]").forEach(el => {
    el.addEventListener("click", () => {
      expandedCat = expandedCat === el.getAttribute("data-expand") ? null : el.getAttribute("data-expand");
      render();
    });
  });
  document.querySelectorAll("[data-num]").forEach(btn => {
    btn.addEventListener("click", () => {
      const field = btn.getAttribute("data-num"); const dir = parseInt(btn.getAttribute("data-dir"));
      form[field] = Math.max(field === "adults" ? 1 : 0, form[field] + dir); render();
    });
  });
  const nameInput = document.getElementById("rsvpName");
  if (nameInput) { nameInput.addEventListener("input", () => { form.name = nameInput.value; updateSubmitBtn(); }); nameInput.addEventListener("change", () => { form.name = nameInput.value; }); }
  const emailInput = document.getElementById("rsvpEmail");
  if (emailInput) { emailInput.addEventListener("input", () => { form.email = emailInput.value; updateSubmitBtn(); }); emailInput.addEventListener("change", () => { form.email = emailInput.value; }); }
  const lookupInput = document.getElementById("lookupEmail");
  if (lookupInput) { lookupInput.addEventListener("input", () => { lookupEmail = lookupInput.value; }); }
  const lookupBtn = document.getElementById("lookupBtn");
  if (lookupBtn) {
    lookupBtn.addEventListener("click", () => {
      const email = lookupEmail.trim().toLowerCase();
      if (!email) { lookupError = "Please enter your email."; render(); return; }
      const match = Object.entries(rsvps).find(([id, r]) => (r.email || "").toLowerCase() === email);
      if (match) {
        const [id, r] = match; editingId = id;
        form = { name: r.name, email: r.email || "", adults: r.adults, teens: r.teens || 0, kids: r.kids, dishes: getDishes(r), extras: r.extras || [] };
        lookupError = ""; lookupEmail = ""; render(); window.scrollTo(0, 0);
      } else { lookupError = "No RSVP found with that email. Submit a new one below."; render(); }
    });
  }
  function updateSubmitBtn() { const btn = document.getElementById("submitBtn"); if (btn) btn.disabled = !form.name.trim() || !form.email.trim(); }
  document.querySelectorAll("[data-cat-toggle]").forEach(btn => {
    btn.addEventListener("click", () => {
      const catId = btn.getAttribute("data-cat-toggle");
      const exists = form.dishes.findIndex(d => d.category === catId);
      if (exists >= 0) form.dishes = form.dishes.filter(d => d.category !== catId);
      else form.dishes = [...form.dishes, { category: catId, item: "", servingSize: "" }];
      render();
    });
  });
  document.querySelectorAll(".dish-item").forEach(input => {
    const idx = parseInt(input.getAttribute("data-dish-idx"));
    input.addEventListener("input", () => { if (form.dishes[idx]) form.dishes[idx].item = input.value; });
    input.addEventListener("change", () => { if (form.dishes[idx]) form.dishes[idx].item = input.value; });
  });
  document.querySelectorAll(".dish-size").forEach(select => {
    const idx = parseInt(select.getAttribute("data-dish-idx"));
    select.addEventListener("change", () => { if (form.dishes[idx]) form.dishes[idx].servingSize = select.value; });
  });
  document.querySelectorAll("[data-extra]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-extra");
      form.extras = form.extras.includes(id) ? form.extras.filter(e => e !== id) : [...form.extras, id];
      render();
    });
  });
  const submitBtn = document.getElementById("submitBtn");
  if (submitBtn) {
    submitBtn.addEventListener("click", async () => {
      if (!form.name.trim() || !form.email.trim()) return;
      const entry = { name: form.name.trim(), email: form.email.trim(), adults: Math.max(1, form.adults), teens: Math.max(0, form.teens), kids: Math.max(0, form.kids), dishes: form.dishes.filter(d => d.item.trim() || d.category), extras: form.extras, ts: new Date().toISOString() };
      submitBtn.disabled = true; submitBtn.textContent = "Submitting...";
      await saveRsvp(editingId, entry);
      if (entry.email) sendConfirmationEmail(entry);
      sendAdminNotification(entry);
      submitted = true; editingId = null; resetForm(); render();
    });
  }
  const anotherBtn = document.getElementById("anotherRsvp");
  if (anotherBtn) { anotherBtn.addEventListener("click", () => { submitted = false; resetForm(); render(); }); }
  const adminToggle = document.getElementById("adminToggle");
  if (adminToggle) { adminToggle.addEventListener("click", () => { if (adminUnlocked) { adminUnlocked = false; render(); } else showPinModal(); }); }
  document.querySelectorAll("[data-edit]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-edit"); const r = rsvps[id]; if (!r) return;
      editingId = id; form = { name: r.name, email: r.email || "", adults: r.adults, teens: r.teens || 0, kids: r.kids, dishes: getDishes(r), extras: r.extras || [] };
      submitted = false; currentView = "rsvp"; render(); window.scrollTo(0, 0);
    });
  });
  document.querySelectorAll("[data-delete]").forEach(btn => { btn.addEventListener("click", async () => { await deleteRsvp(btn.getAttribute("data-delete")); }); });
}

function showPinModal() {
  let pin = ""; let error = false;
  const modal = document.getElementById("pinModal"); if (!modal) return;
  function rm() {
    modal.style.display = "block";
    modal.innerHTML = `<div class="modal-overlay"><div class="modal">
      <div style="font-size:32px;margin-bottom:8px">🔒</div><h3>Admin Access</h3><p>Enter PIN to manage guest list</p>
      <input type="password" inputmode="numeric" maxlength="4" id="pinInput" class="${error?'error':''}" value="${pin}" placeholder="PIN">
      ${error ? '<div class="error-msg">Incorrect PIN</div>' : ''}
      <div class="modal-btns"><button class="cancel" id="pinCancel">Cancel</button><button class="unlock" id="pinUnlock">Unlock</button></div>
    </div></div>`;
    document.getElementById("pinInput").focus();
    document.getElementById("pinInput").addEventListener("input", (e) => { pin = e.target.value.replace(/\D/g, ""); error = false; });
    document.getElementById("pinCancel").addEventListener("click", () => { modal.style.display = "none"; });
    document.getElementById("pinUnlock").addEventListener("click", () => { if (pin === ADMIN_PIN) { adminUnlocked = true; modal.style.display = "none"; render(); } else { error = true; rm(); } });
  }
  rm();
}

loadRsvps();
pollInterval = setInterval(loadRsvps, 10000);
</script>
