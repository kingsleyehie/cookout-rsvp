// ───────────────── FIREBASE ─────────────────
async function loadRsvps(isBackground){
  try {
    const res = await fetch(`${DB_URL}/rsvps.json`);
    const data = await res.json();
    const incoming = data || {};
    if(isBackground){
      // Don't disrupt the user mid-form; skip re-render while typing an RSVP.
      if(currentView==="rsvp") { rsvps = incoming; return; }
      // Only re-render if the data actually changed.
      if(JSON.stringify(incoming) === JSON.stringify(rsvps)) { return; }
    }
    rsvps = incoming;
    render();
  } catch(e){ console.error("Load failed:",e); }
}
async function saveRsvp(id, data){
  try {
    if(id){ await fetch(`${DB_URL}/rsvps/${id}.json`,{method:"PUT",body:JSON.stringify(data)}); }
    else { const res = await fetch(`${DB_URL}/rsvps.json`,{method:"POST",body:JSON.stringify(data)}); id=(await res.json()).name; }
    await loadRsvps(); return id;
  } catch(e){ console.error("Save failed:",e); }
}
async function deleteRsvp(id){ try { await fetch(`${DB_URL}/rsvps/${id}.json`,{method:"DELETE"}); await loadRsvps(); } catch(e){ console.error(e); } }
async function patchRsvp(id, partial){
  try { await fetch(`${DB_URL}/rsvps/${id}.json`,{method:"PATCH",body:JSON.stringify(partial)}); await loadRsvps(); }
  catch(e){ console.error(e); }
}

// ───────────────── HELPERS ─────────────────
function getRsvpList(){ return Object.entries(rsvps).map(([id,data])=>({id,...data})); }
function getTotals(){
  const list=getRsvpList(); let a=0,t=0,k=0;
  list.forEach(r=>{ a+=(+r.adults||0); t+=(+r.teens||0); k+=(+r.kids||0); });
  return { adults:a, teens:t, kids:k, total:a+t+k, families:list.length };
}
function getDishes(r){ return r.dishes && r.dishes.length ? r.dishes : []; }
function dishCountByCat(catId){
  let n=0; getRsvpList().forEach(r=>getDishes(r).forEach(d=>{ if(d.category===catId) n++; })); return n;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function buildRsvpSummary(entry){
  let parts=[`${entry.adults} adult${entry.adults!==1?'s':''}`];
  if(entry.teens>0) parts.push(`${entry.teens} teen${entry.teens!==1?'s':''}`);
  if(entry.kids>0) parts.push(`${entry.kids} kid${entry.kids!==1?'s':''}`);
  let summary=parts.join(', ');
  const dishes=getDishes(entry);
  if(dishes.length){ summary+=' · Bringing: '+dishes.map(d=>d.item||FOOD_CATEGORIES.find(c=>c.id===d.category)?.label||d.category).join(', '); }
  if(entry.extras && entry.extras.length){ summary+=' · Extras: '+entry.extras.map(id=>EXTRAS.find(e=>e.id===id)?.label||id).join(', '); }
  if(entry.gamesDetail){ summary+=' ('+entry.gamesDetail+')'; }
  if(entry.carpool==="offer") summary+=` · Carpool: offering ${entry.seats} seat${entry.seats!==1?'s':''} (${townFromZip(entry.zip)||entry.zip||'area n/a'})`;
  return summary;
}

async function sendConfirmationEmail(entry){
  if(!entry.email) return;
  try { await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
    to_email: entry.email, name: entry.name, rsvp_summary: buildRsvpSummary(entry), event_address: EVENT_ADDRESS

}

}

  }); } catch(e){ console.error("Carpool connect failed:",e); }

// ───────────────── CARPOOL GROUPING ─────────────────
function getCarpoolGroups(){
  const list=getRsvpList().filter(r=>r.carpool==="offer");
  const groups={};
  list.forEach(r=>{
    const area = townFromZip(r.zip) || (r.zip ? `Zip ${r.zip}` : "Area not shared");
    if(!groups[area]) groups[area]={ area, offering:[] };
    groups[area].offering.push(r);
  });
  return Object.values(groups).sort((a,b)=>a.area.localeCompare(b.area));
}

// ───────────────── SVG DECOR ─────────────────
function burstSVG(size,color,delay,pos){
  let lines="";
  for(let i=0;i<10;i++){ const a=(i/10)*Math.PI*2;
    lines+=`<line x1="${50+Math.cos(a)*14}" y1="${50+Math.sin(a)*14}" x2="${50+Math.cos(a)*42}" y2="${50+Math.sin(a)*42}" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="40" style="animation:burstLoop 4.6s ease-out ${delay}s infinite"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" style="position:absolute;pointer-events:none;${pos}">${lines}<circle cx="50" cy="50" r="2.5" fill="${color}" opacity="0.7" style="animation:twinkle 4.6s ease-in-out ${delay+0.3}s infinite"/></svg>`;
}
function starSVG(x,y,s,color,delay){
  return `<svg width="${s*2}" height="${s*2}" viewBox="0 0 20 20" style="position:absolute;left:${x};top:${y}px;pointer-events:none;animation:twinkle 3.4s ease-in-out ${delay}s infinite"><path d="M10 1 L12.2 7.4 L19 7.6 L13.6 11.8 L15.5 18.4 L10 14.5 L4.5 18.4 L6.4 11.8 L1 7.6 L7.8 7.4 Z" fill="${color}"/></svg>`;
}

      <button onclick="nav('guests')" style="flex:1;padding:15px 8px;border-radius:8px;border:1.5px solid rgba(30,42,86,0.19);background:transparent;font-size:10px;font-weight:800;color:var(--navy);letter-spacing:2px">GUEST LIST</button>
      <button onclick="nav('rsvp')" style="flex:1.25;padding:15px 8px;border-radius:8px;border:none;background:var(--red);color:#fff;font-size:11px;font-weight:800;letter-spacing:2.5px;box-shadow:0 5px 18px rgba(178,34,52,0.22)">RSVP</button>
      <button onclick="nav('food')" style="flex:1;padding:15px 8px;border-radius:8px;border:1.5px solid rgba(30,42,86,0.19);background:transparent;font-size:10px;font-weight:800;color:var(--navy);letter-spacing:2px">FOOD BOARD</button>
    </div>
    <div class="rise" style="animation-delay:1s;margin-top:26px;background:var(--red);padding:16px 24px;text-align:center">
      <p style="font-family:'Kaushan Script',cursive;font-size:17px;color:var(--cream);line-height:1.45">Come enjoy great food, great fellowship, and a wonderful evening together!</p>
    </div>
  </div>`;
}

// ───────────────── FOOD ─────────────────
function foodHTML(){
  const cards=FOOD_CATEGORIES.map((cat,i)=>{
    const dishes=[]; getRsvpList().forEach(r=>getDishes(r).forEach(d=>{ if(d.category===cat.id) dishes.push(d); }));
    const cnt=dishes.length;
    let inner=`<div style="padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div style="min-width:0"><div style="font-weight:800;font-size:14px;color:var(--navy);letter-spacing:.2px">${esc(cat.label)}</div><div style="font-size:11px;color:var(--soft);margin-top:3px">${esc(cat.examples)}</div></div>
      <span style="padding:4px 12px;border-radius:20px;font-size:11px;font-weight:800;flex-shrink:0;background:${cnt>0?'rgba(178,34,52,0.055)':'var(--cream)'};color:${cnt>0?'var(--red)':'var(--soft)'};border:1px solid ${cnt>0?'rgba(178,34,52,0.13)':'var(--line)'}">${cnt>0?cnt:'Open'}</span></div>`;
    if(dishes.length){
      inner+=`<div style="border-top:1px dashed var(--line);padding:4px 16px 8px;background:var(--cream)">`+
        dishes.map((d,j)=>`<div style="display:flex;justify-content:space-between;padding:7px 0;font-size:13px;${j<dishes.length-1?'border-bottom:1px dashed var(--line)':''}"><span style="color:var(--ink);font-weight:600">${esc(d.item||cat.label)}</span><span style="color:var(--soft);font-size:12px">${esc(d.servingSize||'')}</span></div>`).join("")+
        `</div>`;
    }
    return `<div class="rise" style="animation-delay:${(0.05+0.03*i).toFixed(2)}s;background:var(--paper);border-radius:10px;border:1px solid var(--line);overflow:hidden">${inner}</div>`;
  }).join("");
  return `<div style="max-width:560px;margin:0 auto;padding:26px 20px 60px">
    <h2 class="rise" style="font-family:'Playfair Display',serif;font-size:34px;font-weight:900;color:var(--navy);text-align:center;margin-bottom:4px">Food Board</h2>
    <p class="rise" style="animation-delay:.05s;font-family:'Great Vibes',cursive;font-size:26px;color:var(--gold);text-align:center;margin-bottom:20px">what's cooking</p>
    <div style="display:flex;flex-direction:column;gap:7px">${cards}</div>
    <button onclick="nav('rsvp')" style="width:100%;padding:17px;border-radius:8px;border:none;background:var(--red);color:#fff;font-size:13px;font-weight:800;letter-spacing:2px;margin-top:24px;box-shadow:0 5px 18px rgba(178,34,52,0.19)">RSVP</button>
  </div>`;
}

// ───────────────── GUESTS ─────────────────
function guestsHTML(){
  const list=getRsvpList().sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  let rows;
  if(list.length===0){
    rows=`<div style="padding:40px 18px;text-align:center;color:var(--soft);font-size:14px">No RSVPs yet — be the first!</div>`;
  } else {
    rows=list.map((g,i)=>{
      const sub=`${g.adults} adult${g.adults!==1?'s':''}`+(g.teens>0?` · ${g.teens} teen${g.teens!==1?'s':''}`:'')+(g.kids>0?` · ${g.kids} kid${g.kids!==1?'s':''}`:'');
      const adminCtl=adminUnlocked?`<button onclick="startEdit('${g.id}')" style="background:none;border:none;color:var(--gold);font-size:11px;font-weight:700;margin-left:8px">Edit</button><button onclick="removeGuest('${g.id}')" style="background:none;border:none;color:var(--red);font-size:11px;font-weight:700">Delete</button>`:'';
      return `<div style="padding:14px 18px;${i<list.length-1?'border-bottom:1px dashed var(--line)':''};display:flex;justify-content:space-between;align-items:baseline;gap:12px">
        <div style="font-size:14px;font-weight:700;color:var(--ink)">${esc(g.name)}</div>
        <div style="font-size:12px;color:var(--soft);font-weight:600;flex-shrink:0;text-align:right">${sub}${adminCtl}</div></div>`;
    }).join("");
  }
  let adminPanel;
  if(adminUnlocked){
    const emails=list.map(g=>g.email).filter(Boolean).join(", ");
    adminPanel=`<div style="margin-top:16px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px">
      <p style="font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--soft);text-transform:uppercase;margin-bottom:10px">Admin · Email List (tap to copy)</p>
      <div onclick="copyEmails(this)" data-emails="${esc(emails)}" style="font-size:12px;color:var(--ink);background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:12px;word-break:break-all;cursor:pointer">${emails?esc(emails):'No emails yet'}</div>
      <button onclick="lockAdmin()" style="margin-top:10px;background:none;border:none;color:var(--soft);font-size:11px;font-weight:700;text-decoration:underline">Lock admin</button>
    </div>`;
  } else {
    adminPanel=`<div style="margin-top:20px;text-align:center"><button onclick="promptPin()" style="background:none;border:none;color:var(--soft);font-size:11px;font-weight:600;opacity:.5">·</button></div>`;
  }
  return `<div style="max-width:560px;margin:0 auto;padding:26px 20px 60px">
    <h2 class="rise" style="font-family:'Playfair Display',serif;font-size:34px;font-weight:900;color:var(--navy);text-align:center;margin-bottom:4px">Guest List</h2>
    <p class="rise" style="animation-delay:.05s;font-family:'Great Vibes',cursive;font-size:26px;color:var(--gold);text-align:center;margin-bottom:20px">${list.length} ${list.length===1?'RSVP':'RSVP'}s &amp; counting</p>
    <div class="rise" style="animation-delay:.1s;background:var(--paper);border-radius:12px;border:1px solid var(--line);overflow:hidden">${rows}</div>
    ${adminPanel}
  </div>`;
}

// ───────────────── CARPOOL ─────────────────
function carpoolHTML(){
  const groups=getCarpoolGroups();
  let body;
  if(groups.length===0){
    body=`<div style="background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:40px 18px;text-align:center;color:var(--soft);font-size:14px;line-height:1.6">No one has offered a ride yet.<br>If you have room in your car, add it when you RSVP and you'll show up here.</div>`;
  } else {
    body=groups.map((group,gi)=>{
      const offerSeats=group.offering.reduce((s,o)=>s+(+o.seats||0),0);
      const summary=`<span style="color:var(--green)">${offerSeats} seat${offerSeats!==1?'s':''} available</span>`;
      let sections=`<div style="padding:10px 16px">`+
        group.offering.map(o=>{
          const full=o.carpoolFull;
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;${full?'opacity:.5':''}">
            <div><span style="font-size:14px;font-weight:700;color:var(--ink);${full?'text-decoration:line-through':''}">${esc(o.name)}</span><span style="font-size:12px;color:var(--soft);margin-left:8px">${o.seats} seat${o.seats!==1?'s':''}</span>${full?'<span style="font-size:11px;color:var(--red);font-weight:700;margin-left:6px">FULL</span>':''}</div>
            ${full?'':`<button onclick="askConnect('${o.id}')" style="padding:7px 16px;border-radius:6px;border:none;background:var(--green);color:#fff;font-size:11px;font-weight:800;letter-spacing:1px;flex-shrink:0">Ask to Connect</button>`}
            ${adminUnlocked?`<button onclick="toggleFull('${o.id}',${full?'false':'true'})" style="margin-left:6px;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:10px;font-weight:700;color:var(--soft);flex-shrink:0">${full?'Reopen':'Mark full'}</button>`:''}
          </div>`;
        }).join("")+`</div>`;
      return `<div class="rise" style="animation-delay:${(0.1+gi*0.05).toFixed(2)}s;background:var(--paper);border-radius:12px;border:1px solid var(--line);overflow:hidden">
        <div style="padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:var(--cream)">
          <div style="font-weight:800;font-size:15px;color:var(--navy)">${esc(group.area)}</div>
          <div style="font-size:11px;color:var(--soft);font-weight:600">${summary}</div>
        </div>${sections}</div>`;
    }).join("");
  }
  return `<div style="max-width:560px;margin:0 auto;padding:26px 20px 60px">
    <h2 class="rise" style="font-family:'Playfair Display',serif;font-size:34px;font-weight:900;color:var(--navy);text-align:center;margin-bottom:4px">Carpool</h2>
    <p class="rise" style="animation-delay:.05s;font-family:'Great Vibes',cursive;font-size:26px;color:var(--gold);text-align:center;margin-bottom:10px">let's ride together</p>
    <p class="rise" style="animation-delay:.08s;font-size:12px;color:var(--soft);text-align:center;margin:0 auto 24px;line-height:1.5;max-width:380px">These neighbors have room in their car. Find someone nearby and tap "Ask to Connect" — Kingsley will introduce you. Contact info is never shown publicly.</p>
    <div style="display:flex;flex-direction:column;gap:16px">${body}</div>
    <button onclick="nav('rsvp')" style="width:100%;padding:17px;border-radius:8px;border:none;background:var(--red);color:#fff;font-size:13px;font-weight:800;letter-spacing:2px;margin-top:24px;box-shadow:0 5px 18px rgba(178,34,52,0.19)">RSVP &amp; Join Carpool</button>
    <p style="font-size:11px;color:var(--soft);text-align:center;margin-top:14px;font-style:italic;line-height:1.5">Tap "Ask to Connect" and Kingsley will introduce you both so you can arrange a ride. No contact info is shared publicly.</p>
  </div>`;
}

// ───────────────── RSVP ─────────────────
function rsvpHTML(){
  if(submitted) return rsvpSuccessHTML();
  const counter=(label,field)=>`<label style="display:block;font-size:10px;font-weight:800;color:var(--soft);margin-bottom:6px;margin-top:16px;letter-spacing:1.5px;text-transform:uppercase">${label}</label>
    <div style="display:flex;align-items:center;gap:16px"><button onclick="adjust('${field}',-1)" style="width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--cream);font-size:16px;font-weight:700;color:var(--navy)">−</button><span style="font-size:20px;font-weight:800;color:var(--ink);min-width:24px;text-align:center">${form[field]}</span><button onclick="adjust('${field}',1)" style="width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--cream);font-size:16px;font-weight:700;color:var(--navy)">+</button></div>`;

  // dish category buttons
  const dishBtns=FOOD_CATEGORIES.map(cat=>{
    const sel=form.dishes.find(d=>d.category===cat.id);
    const cnt=dishCountByCat(cat.id);
    return `<button onclick="toggleDish('${cat.id}')" style="padding:13px 12px;border-radius:8px;border:${sel?'2px solid var(--red)':'1px solid var(--line)'};background:${sel?'rgba(178,34,52,0.03)':'var(--paper)'};color:${sel?'var(--red)':'var(--ink)'};font-size:12px;font-weight:${sel?800:600};text-align:left">${esc(cat.label)}${cnt>0?`<div style="font-size:10px;color:var(--soft);margin-top:3px;font-weight:600">${cnt} signed up</div>`:''}</button>`;
  }).join("");
  // dish detail inputs for selected
  const dishDetails=form.dishes.map(d=>{
    const cat=FOOD_CATEGORIES.find(c=>c.id===d.category);
    const opts=['Select...'].concat(SERVING_SIZES).map(s=>`<option ${d.servingSize===s?'selected':''}>${s}</option>`).join("");
    return `<div style="margin-top:12px;padding:16px;background:rgba(178,34,52,0.035);border:1px solid rgba(178,34,52,0.11);border-radius:8px">
      <div style="font-size:13px;font-weight:800;color:var(--red);margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase">${esc(cat.label)}</div>
      <label style="display:block;font-size:10px;font-weight:800;color:var(--soft);margin-bottom:6px;letter-spacing:1.5px;text-transform:uppercase">What are you bringing?</label>
      <input value="${esc(d.item||'')}" oninput="setDishItem('${d.category}',this.value)" placeholder="e.g. Jollof, mac & cheese, pasta salad..." style="width:100%;padding:13px 15px;border-radius:8px;border:1px solid var(--line);background:var(--cream);font-size:14px;color:var(--ink);outline:none">
      <label style="display:block;font-size:10px;font-weight:800;color:var(--soft);margin:16px 0 6px;letter-spacing:1.5px;text-transform:uppercase">Serving Size</label>
      <select onchange="setDishSize('${d.category}',this.value)" style="width:100%;padding:13px 15px;border-radius:8px;border:1px solid var(--line);background:var(--cream);font-size:14px;color:var(--ink);outline:none;appearance:none">${opts}</select>
    </div>`;
  }).join("");

  // carpool
  let cpDetail="";
  if(form.carpool==="offer"){
    cpDetail=`<div style="background:rgba(45,106,79,0.05);border:1px solid rgba(45,106,79,0.18);border-radius:10px;padding:16px">
      <label style="display:block;font-size:10px;font-weight:800;color:var(--soft);margin-bottom:6px;letter-spacing:1.5px;text-transform:uppercase">Seats you can offer</label>
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:14px"><button onclick="adjust('seats',-1)" style="width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--cream);font-size:16px;font-weight:700;color:var(--navy)">−</button><span style="font-size:22px;font-weight:800;color:var(--ink);min-width:28px;text-align:center">${form.seats}</span><button onclick="adjust('seats',1)" style="width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--cream);font-size:16px;font-weight:700;color:var(--navy)">+</button></div>
      ${zipPhoneInputs()}
      <p style="font-size:11px;color:var(--soft);margin-top:8px;line-height:1.4">Your zip is only used to group you by area. Your number is never shown publicly — it's shared only when Kingsley connects you with someone who needs a ride.</p>
    </div>`;
  }

  const lookupBlock=showLookup?`<div style="background:var(--paper);border-radius:12px;padding:20px;margin-bottom:12px;border:1px solid var(--line)">
    <h3 style="font-family:'Playfair Display',serif;font-size:17px;font-weight:900;color:var(--navy);margin-bottom:10px">Update Your RSVP</h3>
    <p style="font-size:12px;color:var(--soft);margin-bottom:10px">Enter the email you used and we'll load your RSVP to edit.</p>
    <input id="lookupEmail" value="${esc(lookupEmail)}" placeholder="your@email.com" style="width:100%;padding:13px 15px;border-radius:8px;border:1px solid var(--line);background:var(--cream);font-size:14px;color:var(--ink);outline:none;box-sizing:border-box">
    ${lookupError?`<p style="font-size:12px;color:var(--red);margin-top:8px">${esc(lookupError)}</p>`:''}
    <button onclick="doLookup()" style="width:100%;margin-top:12px;padding:13px;border-radius:8px;border:none;background:var(--navy);color:#fff;font-size:12px;font-weight:800;letter-spacing:1px">Find My RSVP</button>
  </div>`:'';

  return `<div style="max-width:560px;margin:0 auto;padding:26px 20px 60px">
    <div class="rise" style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px">
      <h2 style="font-family:'Playfair Display',serif;font-size:34px;font-weight:900;color:var(--navy)">${editingId?'Edit RSVP':'RSVP'}</h2>
      <button onclick="toggleLookup()" style="background:none;border:none;font-size:12px;color:var(--gold);font-weight:700;text-decoration:underline;text-underline-offset:3px">${showLookup?'Cancel':'Update RSVP'}</button>
    </div>
    ${lookupBlock}
    <div class="rise" style="animation-delay:.05s;background:var(--paper);border-radius:12px;padding:20px;margin-bottom:12px;border:1px solid var(--line)">
      <h3 style="font-family:'Playfair Display',serif;font-size:19px;font-weight:900;color:var(--navy);margin-bottom:14px">Who's Coming?</h3>
      <label style="display:block;font-size:10px;font-weight:800;color:var(--soft);margin-bottom:6px;letter-spacing:1.5px;text-transform:uppercase">Name / Family Name</label>
      <input value="${esc(form.name)}" oninput="setField('name',this.value)" placeholder="e.g. Okafor Family" style="width:100%;padding:13px 15px;border-radius:8px;border:1px solid var(--line);background:var(--cream);font-size:14px;color:var(--ink);outline:none;box-sizing:border-box">
      <label style="display:block;font-size:10px;font-weight:800;color:var(--soft);margin:16px 0 6px;letter-spacing:1.5px;text-transform:uppercase">Email</label>
      <input value="${esc(form.email)}" oninput="setField('email',this.value)" type="email" placeholder="e.g. name@email.com" style="width:100%;padding:13px 15px;border-radius:8px;border:1px solid var(--line);background:var(--cream);font-size:14px;color:var(--ink);outline:none;box-sizing:border-box">
      ${counter('Adults','adults')}${counter('Teens (13–17)','teens')}${counter('Children','kids')}
    </div>
    <div class="rise" style="animation-delay:.1s;background:var(--paper);border-radius:12px;padding:20px;margin-bottom:12px;border:1px solid var(--line)">
      <h3 style="font-family:'Playfair Display',serif;font-size:19px;font-weight:900;color:var(--navy);margin-bottom:14px">Bringing a Dish?</h3>
      <p style="font-size:13px;color:var(--soft);margin-bottom:8px;line-height:1.5">We invite you to bring your favorite dish or delicacy. Tap one or more categories.</p>
      <p style="margin-bottom:16px"><button onclick="nav('food')" style="background:none;border:none;font-size:12px;color:var(--gold);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:0">See what's already being brought</button></p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${dishBtns}</div>
      ${dishDetails}
    </div>
    <div class="rise" style="animation-delay:.13s;background:var(--paper);border-radius:12px;padding:20px;margin-bottom:12px;border:1px solid var(--line)">
      <h3 style="font-family:'Playfair Display',serif;font-size:19px;font-weight:900;color:var(--navy);margin-bottom:6px">Bringing Any Extras?</h3>
      <p style="font-size:12px;color:var(--soft);margin-bottom:14px">Optional — but always appreciated!</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        ${EXTRAS.map(ex=>{const on=form.extras.includes(ex.id);return `<button onclick="toggleExtra('${ex.id}')" style="padding:10px 18px;border-radius:20px;border:${on?'2px solid var(--green)':'1px solid var(--line)'};background:${on?'rgba(45,106,79,0.06)':'var(--paper)'};cursor:pointer;font-size:12px;font-weight:700;color:${on?'var(--green)':'var(--ink)'}">${esc(ex.label)}</button>`;}).join("")}
      </div>
      ${form.extras.includes('games')?`<div style="margin-top:12px;padding:16px;background:rgba(45,106,79,0.05);border:1px solid rgba(45,106,79,0.18);border-radius:10px">
        <label style="display:block;font-size:10px;font-weight:800;color:var(--soft);margin-bottom:6px;letter-spacing:1.5px;text-transform:uppercase">Which game(s)?</label>
        <input value="${esc(form.gamesDetail||'')}" oninput="setField('gamesDetail',this.value)" placeholder="e.g. Cornhole, spades, dominoes, soccer ball..." style="width:100%;padding:13px 15px;border-radius:8px;border:1px solid var(--line);background:var(--cream);font-size:14px;color:var(--ink);outline:none;box-sizing:border-box">
      </div>`:''}
    </div>
    <div class="rise" style="animation-delay:.15s;background:var(--paper);border-radius:12px;padding:20px;margin-bottom:12px;border:1px solid var(--line)">
      <h3 style="font-family:'Playfair Display',serif;font-size:19px;font-weight:900;color:var(--navy);margin-bottom:6px">Can You Offer a Ride?</h3>
      <p style="font-size:13px;color:var(--soft);margin-bottom:16px;line-height:1.5">Optional — if you have room in your car, let us know. We'll list you on the Carpool board so neighbors who need a ride can ask to connect.</p>
      <div style="display:flex;flex-direction:column;gap:8px;${form.carpool==='offer'?'margin-bottom:16px':''}">
        <button onclick="setCarpool('${form.carpool==='offer'?'none':'offer'}')" style="width:100%;text-align:left;padding:14px 16px;border-radius:10px;border:${form.carpool==='offer'?'2px solid var(--green)':'1px solid var(--line)'};background:${form.carpool==='offer'?'rgba(45,106,79,0.08)':'var(--paper)'};color:${form.carpool==='offer'?'var(--green)':'var(--ink)'}"><div style="font-weight:800;font-size:14px">${form.carpool==='offer'?'✓ ':''}Yes, I can offer seats</div><div style="font-size:12px;opacity:.8;margin-top:2px">Happy to pick up others on the way</div></button>
      </div>
      ${cpDetail}
    </div>
    <button onclick="submitForm()" style="width:100%;padding:17px;border-radius:8px;border:none;background:var(--red);color:#fff;font-size:13px;font-weight:800;letter-spacing:2px;box-shadow:0 5px 18px rgba(178,34,52,0.19)">${editingId?'Save Changes':'Submit RSVP'}</button>
    <p style="font-size:11px;color:var(--soft);text-align:center;margin-top:10px;font-style:italic">Address will be shared in your confirmation email</p>
  </div>`;
}
function zipPhoneInputs(){
  return `<label style="display:block;font-size:10px;font-weight:800;color:var(--soft);margin-bottom:6px;letter-spacing:1.5px;text-transform:uppercase">Your Zip Code</label>

// ───────────────── ROUTER + RENDER ─────────────────
function render(){
  const app=document.getElementById("app");
  let content;
  if(currentView==="home") content=homeHTML();
  else if(currentView==="food") content=foodHTML();
  else if(currentView==="guests") content=guestsHTML();
  else if(currentView==="carpool") content=carpoolHTML();
  else if(currentView==="rsvp") content=rsvpHTML();
  else content=homeHTML();
  const showTicker=currentView!=="home"?tickerHTML():tickerHTML();
  app.innerHTML=navHTML(currentView)+showTicker+content;
}
function nav(v){
  currentView=v;
  if(v!=="rsvp"){ submitted=false; }
  window.scrollTo(0,0);
  history.pushState({view:v},"",`#${v}`);
  render();
}
window.addEventListener("popstate",e=>{ currentView=(e.state&&e.state.view)||"home"; render(); });

// ───────────────── FORM ACTIONS ─────────────────
function setField(f,v){ form[f]=v; }
function adjust(f,d){
  if(f==="seats"){ form.seats=Math.max(1,form.seats+d); }
  else if(f==="adults"){ form.adults=Math.max(1,form.adults+d); }
  else { form[f]=Math.max(0,form[f]+d); }
  render();
}
function toggleDish(catId){
  const i=form.dishes.findIndex(d=>d.category===catId);
  if(i>=0) form.dishes.splice(i,1);
  else form.dishes.push({category:catId,item:"",servingSize:""});
  render();
}
function setDishItem(catId,v){ const d=form.dishes.find(x=>x.category===catId); if(d) d.item=v; }
function setDishSize(catId,v){ const d=form.dishes.find(x=>x.category===catId); if(d) d.servingSize=(v==="Select..."?"":v); }
function setCarpool(m){ form.carpool=m; render(); }
function toggleExtra(id){ const i=form.extras.indexOf(id); if(i>=0) form.extras.splice(i,1); else form.extras.push(id); render(); }

async function submitForm(){
  if(!form.name.trim()){ alert("Please enter your name."); return; }
  const entry={
    name:form.name.trim(), email:form.email.trim(),
    adults:form.adults, teens:form.teens, kids:form.kids,
    dishes:form.dishes.filter(d=>d.item||d.servingSize).map(d=>({category:d.category,item:d.item,servingSize:d.servingSize})),
    extras:form.extras.slice(),
    gamesDetail:form.extras.includes("games")?form.gamesDetail.trim():"",
    carpool:(form.carpool&&form.carpool!=="none")?form.carpool:null,
    timestamp:Date.now()
  };
  if(entry.carpool==="offer"){ entry.seats=form.seats; entry.zip=form.zip.trim(); entry.phone=form.phone.trim(); entry.carpoolFull=false; }
  const wasEditing=editingId;
  const id=await saveRsvp(editingId,entry);
  if(!wasEditing){ sendConfirmationEmail({...entry}); sendAdminNotification({...entry}); }
  editingId=null; form=freshForm(); submitted=true; currentView="rsvp"; window.scrollTo(0,0); render();
}

// ───────────────── UPDATE / LOOKUP ─────────────────
function toggleLookup(){ showLookup=!showLookup; lookupError=""; render(); }
function doLookup(){
  const val=document.getElementById("lookupEmail").value.trim().toLowerCase();
  lookupEmail=val;
  if(!val){ lookupError="Please enter an email."; render(); return; }
  const match=getRsvpList().find(r=>(r.email||"").toLowerCase()===val);
  if(!match){ lookupError="No RSVP found with that email."; render(); return; }
  editingId=match.id;
  form={ name:match.name||"", email:match.email||"", adults:match.adults||1, teens:match.teens||0, kids:match.kids||0,
    dishes:(match.dishes||[]).map(d=>({...d})), extras:(match.extras||[]).slice(), gamesDetail:match.gamesDetail||"", carpool:match.carpool||null, seats:match.seats||2, zip:match.zip||"", phone:match.phone||"" };
  showLookup=false; lookupError=""; submitted=false; window.scrollTo(0,0); render();
}
function startEdit(id){
  const match=getRsvpList().find(r=>r.id===id); if(!match) return;
  editingId=id;
  form={ name:match.name||"", email:match.email||"", adults:match.adults||1, teens:match.teens||0, kids:match.kids||0,
    dishes:(match.dishes||[]).map(d=>({...d})), extras:(match.extras||[]).slice(), gamesDetail:match.gamesDetail||"", carpool:match.carpool||null, seats:match.seats||2, zip:match.zip||"", phone:match.phone||"" };
  submitted=false; nav("rsvp");
}
async function removeGuest(id){ if(confirm("Delete this RSVP? This cannot be undone.")){ await deleteRsvp(id); } }

// ───────────────── CARPOOL ACTIONS ─────────────────
async function askConnect(targetId){
  const target=getRsvpList().find(r=>r.id===targetId); if(!target) return;
  const name=prompt("Your name (so Kingsley knows who to connect):"); if(!name) return;
  const seatsNeeded=prompt("How many seats do you need?","1")||"";
  const phone=prompt("Your contact number (so Kingsley can connect you):")||"";
  await sendCarpoolConnect({name:name.trim(),phone:phone.trim(),seatsNeeded:seatsNeeded.trim()}, target);
  alert("Got it! Kingsley has been notified and will connect you. Thank you!");
}
async function toggleFull(id,makeFull){ await patchRsvp(id,{carpoolFull:makeFull}); }

// ───────────────── ADMIN ─────────────────
function promptPin(){
  const p=prompt("Admin PIN:");
  if(p===ADMIN_PIN){ adminUnlocked=true; render(); }
  else if(p!==null){ alert("Incorrect PIN."); }
}
function lockAdmin(){ adminUnlocked=false; render(); }
function copyEmails(el){
  const emails=el.getAttribute("data-emails");
  if(!emails) return;
  navigator.clipboard.writeText(emails).then(()=>{ const o=el.textContent; el.textContent="Copied!"; setTimeout(()=>{el.textContent=o;},1200); });
}

// ───────────────── INIT ─────────────────
const initialHash=window.location.hash.replace("#","");
if(["home","food","guests","carpool","rsvp"].includes(initialHash)) currentView=initialHash;
loadRsvps();
if(!window.__cookoutPoll){ window.__cookoutPoll = setInterval(()=>loadRsvps(true), 30000); }
</script>
